[project]
name = "omnivoice-voice-clone-kit"
version = "0.1.0"
description = "Standalone voice cloning toolkit built on OmniVoice"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch",
  "torchaudio",
  "omnivoice",
  "fastapi",
  "gradio",
  "soundfile",
  "uvicorn",
  "python-multipart",
  "faster-whisper",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voicekit", "voicekit.scripts"]
py-modules = [
  "backup_model",
  "verify_checksum",
]

[project.scripts]
voicekit = "voicekit.cli:main"
voicekit-ui = "voicekit.ui:main"
