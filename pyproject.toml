[project]
name = "omnivoice-voice-clone-kit"
version = "0.1.0"
description = "Standalone voice cloning toolkit built on OmniVoice"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "omnivoice==0.1.5",
  "fastapi==0.136.1",
  "gradio==6.14.0",
  "soundfile==0.13.1",
  "uvicorn==0.46.0",
  "websockets==15.0.1",
  "python-multipart==0.0.27",
  "psycopg[binary]==3.2.13",
  "faster-whisper==1.2.1",
  "deep-translator==1.11.4",
  "pyannote-audio==4.0.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voicekit", "voicekit.scripts"]
py-modules = [
  "backup_model",
  "verify_checksum",
]

[project.scripts]
voicekit = "voicekit.cli:main"
voicekit-ui = "voicekit.ui:main"
voicekit-mcp = "voicekit.mcp_server:main"
